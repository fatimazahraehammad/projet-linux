name: CI - Tests Backend et Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  backend-tests:
    name: Tests Laravel
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, pdo_mysql
      - name: Installer les dépendances
        working-directory: ./backend
        run: composer install --no-interaction --prefer-dist
      - name: Copier .env
        working-directory: ./backend
        run: cp .env.example .env
      - name: Configurer .env pour CI
        working-directory: ./backend
        run: |
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=test_db/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env
      - name: Générer la clé app
        working-directory: ./backend
        run: php artisan key:generate
      - name: Lancer les migrations
        working-directory: ./backend
        run: php artisan migrate --force
      - name: Lancer les tests Laravel
        working-directory: ./backend
        run: php artisan test

  frontend-build:
    name: Build Angular
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        working-directory: ./frontend
        run: npm install
      - name: Build Angular
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Build Images Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Créer .env pour le build backend
        run: cp backend/.env.example backend/.env
      - name: Build image Backend
        run: docker build -t backend-laravel ./backend
      - name: Build image Frontend
        run: docker build -t frontend-angular ./frontend

  docker-push:
    name: Push Images Docker Hub
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Créer .env pour le build backend
        run: cp backend/.env.example backend/.env
      - name: Build et Push image Backend
        run: |
          docker build -t projetlinux12/backend-laravel:latest ./backend
          docker push projetlinux12/backend-laravel:latest
      - name: Build et Push image Frontend
        run: |
          docker build -t projetlinux12/frontend:latest ./frontend
          docker push projetlinux12/frontend:latest

  terraform:
    name: Terraform - Créer serveur AWS
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          terraform apply -auto-approve \
            -var="public_key=${{ secrets.SSH_PUBLIC_KEY }}"
