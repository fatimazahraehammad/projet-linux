services:
  backend:
    image: projetlinux12/backend-laravel:latest
    container_name: laravel_app
    ports:
      - "8000:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=projet_db
      - DB_USERNAME=laravel_user
      - DB_PASSWORD=secret
    depends_on:
      - mysql
    networks:
      - app-network

  migrator:
    image: projetlinux12/backend-laravel:latest
    container_name: laravel_migrator
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=projet_db
      - DB_USERNAME=laravel_user
      - DB_PASSWORD=secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    # --force is required to run in non-interactive (production-like) environments
    command: >
      sh -c "php artisan migrate --force &&
             php artisan db:seed --force"
    restart: "no"

  frontend:
    image: projetlinux12/frontend:latest
    container_name: angular_app
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: projet_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "laravel_user", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - PMA_USER=laravel_user
      - PMA_PASSWORD=secret
    depends_on:
      - mysql
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
