<div class="content">
  <h2>Commandes</h2>

  <table>
    <tr>
      <th>ID</th>
      <th>Client</th>
      <th>Total</th>
      <th>Status</th>
    </tr>

    <tr *ngFor="let c of commandes">
      <td>{{ c.id }}</td>
      <td>{{ c.client }}</td>
      <td>{{ c.total }} DH</td>
      <td>{{ c.status }}</td>
    </tr>
  </table>
</div>
